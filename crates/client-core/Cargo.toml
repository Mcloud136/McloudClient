[package]
name = "client-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Minimal Rust client data plane: SOCKS5 -> VLESS/WS/TLS/mlkem (R2 PoC)"

[[bin]]
name = "client-core"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.5"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
ipnet = "2.12"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs", "logging"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }
# 复用节点服务端仓库的共享协议 crate（VLESS 帧 + mlkem 握手）。
# 以 tag 固定版本，保证仓库可独立构建。
v2node-proto = { git = "https://github.com/Mcloud136/v2node-rust", tag = "v0.2.0" }

[lints]
workspace = true
