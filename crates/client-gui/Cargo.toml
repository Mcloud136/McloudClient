[package]
name = "client-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# 规则编辑复用内核同一套解析/校验（单一事实源），避免 GUI 与内核规则语义分叉。
client-core = { path = "../client-core", version = "0.1.0" }
client-sidecar = { path = "../client-sidecar", version = "0.1.0" }
png = "0.17"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1"

# GUI：windows-reactor（原生 WinUI，ADR 0005 定案，spike 实测 RSS 119 MiB）。
# 预览期 API 精确 pin；仅 Windows 目标依赖，非 Windows 编译桩保证双平台 CI。
[target.'cfg(windows)'.dependencies]
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "8ca69fdaa9d69c78b9bcfbee96c6916f2282e7f0", version = "0.101.0" }
winreg = "0.55"

[dev-dependencies]
# 集成测试需要为桩内核实现 client-sidecar::Handler。
async-trait = "0.1"

[lints]
workspace = true
