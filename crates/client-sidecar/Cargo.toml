[package]
name = "client-sidecar"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs", "logging"] }
rustls-native-certs = "0.8.5"
thiserror = "2"
tokio-rustls = "0.26.6"
tracing = "0.1"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
zeroize = "1"
sha2 = "0.10"
# Ed25519 更新 manifest 签名（FA 硬前置）；ring 已在依赖树（rustls-webpki）。
ring = "0.17.14"

[target.'cfg(windows)'.dependencies]
# keyring 3 + 仅 windows-native：避免 4.x v1 feature 捆绑 Linux zbus 后端
# （zbus_names/zvariant 有 unmaintained 公告，Windows 用不到也不应进依赖树）。
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }

[lints]
workspace = true
