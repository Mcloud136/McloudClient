# 依赖策略（G1 §8.3 第 3 条 / A0 新依赖硬前置）。
# 许可口径与 README「许可」节一致：本项目 MIT；MPL-2.0 仅覆盖 v2node-proto 自身文件，
# 分发二进制须附 MPL 文本与源码获取方式；GEOIP 数据 CC-BY-SA 2.0 不在 crate 依赖树内，另行处理。

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "OpenSSL",
  # egui 默认字体（epaint_default_fonts）：OFL 与 Ubuntu 字体许可均允许随二进制嵌入分发
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.93

# v2node-proto 上游 manifest 未声明 license 字段；其仓库 LICENSE 与 README 均为 MPL-2.0。
# 上游补字段后删除本 clarify。
[[licenses.clarify]]
name = "v2node-proto"
expression = "MPL-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
# 0.20 起漏洞固定为 error（不可调级）；unmaintained 为作用域，yanked 为告警级。
unmaintained = "all"
yanked = "warn"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Mcloud136/v2node-rust"]